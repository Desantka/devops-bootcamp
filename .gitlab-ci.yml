# Root CI entry — orchestration only
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - info
  - report
  - validate
  - build

include:
  - local: 'ci/defaults.yml'
  - local: 'ci/jobs-k8s.yml'
  - local: 'ci/jobs-info.yml'
  - local: 'ci/jobs-report.yml'
  - local: 'ci/jobs-docker.yml'
