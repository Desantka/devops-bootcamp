k8s:validate:
  stage: validate
  image:
    name: ghcr.io/yannh/kubeconform:v0.6.7-alpine
    entrypoint: [""]
  script:
    - echo "Validating Kubernetes manifests with kubeconform..."
    - /kubeconform -summary -strict k8s/deployment.yaml k8s/service.yaml k8s/ingress.yaml
    - echo "All k8s manifests are valid"
